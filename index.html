<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nail Art Studio</title>
<style>
  :root{--bg:#ffeef5;--card:#fff;--ink:#5a2547;--accent:#ff5fa2;--accent2:#c471ed;--muted:#a77b98;--line:#ffd3e6}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Quicksand","Comic Sans MS","Segoe UI",system-ui,sans-serif;background:linear-gradient(180deg,#ffe3f0 0%,#f3e4ff 100%) fixed;color:var(--ink)}
  header{background:linear-gradient(135deg,#ff7eb6,#c471ed);color:#fff;padding:26px 16px 30px;text-align:center;border-radius:0 0 36px 36px;box-shadow:0 8px 24px rgba(255,95,162,.35)}
  header h1{margin:0;font-size:1.9rem;font-family:"Pacifico","Brush Script MT","Segoe Script",cursive;font-weight:400;text-shadow:0 2px 6px rgba(120,30,90,.3)}
  header p{margin:6px 0 0;opacity:.95;font-size:.9rem}
  main{max-width:760px;margin:0 auto;padding:16px}
  .summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
  .stat{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px;text-align:center;box-shadow:0 4px 14px rgba(255,95,162,.15)}
  .stat b{display:block;font-size:1.7rem;background:linear-gradient(135deg,#ff5fa2,#c471ed);-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat span{color:var(--muted);font-size:.85rem}
  h2{font-size:1.15rem;margin:20px 0 10px;color:#c2307a}
  table{border-radius:20px !important;border:2px solid var(--line) !important}
  th{background:#ffe0ee !important}
  .actions button{border-radius:20px !important;border:2px solid var(--line) !important}
  .item{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:12px 14px;margin-bottom:12px;box-shadow:0 4px 14px rgba(196,113,237,.15)}
  .thumb{position:relative;width:64px;height:64px;flex:none;border-radius:12px;background:#fbe6ee center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:1.8rem;cursor:pointer;border:1px dashed var(--line);overflow:hidden}
  .thumb small{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.45);color:#fff;font-size:.6rem;text-align:center;padding:1px 0}
  .item .info{flex:1}
  .name{font-weight:600}
  .price{color:var(--muted);font-size:.9rem}
  .ctrl{display:flex;align-items:center;gap:10px}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px}
  .ctrl button{width:42px;height:42px;font-size:1.4rem;border-radius:50%;background:linear-gradient(135deg,#ff7eb6,#c471ed);color:#fff;box-shadow:0 3px 8px rgba(255,95,162,.4)}
  .ctrl button.minus{background:#ffe0ee;color:var(--ink);box-shadow:none}
  .thumb{border-radius:50% !important;border:2px solid #ffb3d4 !important}
  .count{min-width:28px;text-align:center;font-weight:700;font-size:1.1rem}
  .actions button{width:100%;padding:12px;background:#fff;border:1px solid var(--line);color:#b3261e;margin-top:6px}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:.92rem}
  th{background:#fbe6ee}
  .r{text-align:right}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding:20px}
</style>
</head>
<body>
<header><h1>💅 Nail Art Studio ✨</h1><p>💖 pretty nails, pretty prices 💖</p><p id="today"></p></header>
<main>
  <div class="summary">
    <div class="stat"><b id="totalItems">0</b><span>Services today</span></div>
    <div class="stat"><b id="totalRs">Rs 0</b><span>Sales today (PKR)</span></div>
  </div>
  <h2>Price list — tap + to record a sale</h2>
  <div id="menu"></div>
  <div class="actions"><button id="resetBtn">Reset today</button></div>
  <h2>Recent days</h2>
  <table>
    <thead><tr><th>Date</th><th class="r">Services</th><th class="r">Sales</th></tr></thead>
    <tbody id="history"></tbody>
  </table>
</main>
<footer>🌸 Made with love 🌸 · Data is saved in this browser only.</footer>
<script>
const MENU = [
  {id:"manicure", name:"Classic Manicure",        price:1500},
  {id:"pedicure", name:"Classic Pedicure",        price:2000},
  {id:"gel",      name:"Gel Polish",              price:2500},
  {id:"acrylic",  name:"Acrylic Extensions",      price:6000},
  {id:"design",   name:"Nail Art Design (per hand)", price:1500},
  {id:"french",   name:"French Tips",             price:2000},
  {id:"stones",   name:"Stones / Charms (per nail)", price:200},
  {id:"removal",  name:"Gel / Acrylic Removal",   price:1000}
];
const KEY = "nailStudioSales";
const PIC_KEY = "nailStudioPics";
const EMOJI = {manicure:"💅",pedicure:"🦶",gel:"✨",acrylic:"💎",design:"🎨",french:"🤍",stones:"💠",removal:"🧴"};
let pics = {};
try { pics = JSON.parse(localStorage.getItem(PIC_KEY)) || {}; } catch(e) {}
function setPic(id, file){
  if(!file) return;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const s = 160, c = document.createElement("canvas");
    c.width = c.height = s;
    const m = Math.min(img.width, img.height);
    c.getContext("2d").drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, s, s);
    pics[id] = c.toDataURL("image/jpeg", 0.8);
    try { localStorage.setItem(PIC_KEY, JSON.stringify(pics)); } catch(e) { alert("Could not save photo (storage full)."); }
    URL.revokeObjectURL(url); render();
  };
  img.src = url;
}
const pkr = n => "Rs " + n.toLocaleString("en-PK");
const todayKey = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
let data = {};
try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e) {} };
const day = () => data[todayKey()] || (data[todayKey()] = {});
function change(id, delta){ const d=day(); d[id]=Math.max(0,(d[id]||0)+delta); save(); render(); }
function totals(d){ let items=0, rs=0; MENU.forEach(m=>{const c=d[m.id]||0; items+=c; rs+=c*m.price;}); return {items,rs}; }
function render(){
  document.getElementById("today").textContent = new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const d = day(), t = totals(d);
  document.getElementById("totalItems").textContent = t.items;
  document.getElementById("totalRs").textContent = pkr(t.rs);
  const menu = document.getElementById("menu"); menu.innerHTML = "";
  MENU.forEach(m => {
    const row = document.createElement("div"); row.className = "item";
    row.innerHTML = `<label class="thumb" title="Tap to add a photo" style="${pics[m.id] ? `background-image:url(${pics[m.id]})` : ""}">${pics[m.id] ? "" : EMOJI[m.id]}<small>${pics[m.id] ? "change" : "add photo"}</small><input type="file" accept="image/*" hidden></label>
      <div class="info"><div class="name">${m.name}</div><div class="price">${pkr(m.price)}</div></div>
      <div class="ctrl"><button class="minus" aria-label="Remove one">−</button><span class="count">${d[m.id]||0}</span><button aria-label="Add one">+</button></div>`;
    const [minus, plus] = row.querySelectorAll("button");
    minus.onclick = () => change(m.id,-1); plus.onclick = () => change(m.id,1);
    row.querySelector("input[type=file]").onchange = e => setPic(m.id, e.target.files[0]);
    menu.appendChild(row);
  });
  document.getElementById("history").innerHTML = Object.keys(data).sort().reverse().slice(0,7).map(k=>{
    const x = totals(data[k]); return `<tr><td>${k}</td><td class="r">${x.items}</td><td class="r">${pkr(x.rs)}</td></tr>`;
  }).join("") || `<tr><td colspan="3">No sales yet.</td></tr>`;
}
document.getElementById("resetBtn").onclick = () => { if(confirm("Reset today's counter to zero?")){ data[todayKey()]={}; save(); render(); } };
render(); setInterval(render, 60000);
</script>
</body>
</html>
